name: Release

# Releases are cut from main by pushing a vX.Y.Z tag that matches the root package.json
# version (docs/releasing.md). workflow_dispatch defaults to a dry run: the same build,
# packaging and notes, uploaded as workflow artifacts, with no release and no tap push.
# PRs that touch the release machinery get that dry run automatically.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - apps/cli/build.ts
      - CHANGELOG.md
      - cliff.toml
      - packaging/**
      - scripts/render-formula.ts
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only; no GitHub release, no tap push
        type: boolean
        default: true
      version:
        description: Expected version (X.Y.Z); must match package.json. Blank uses package.json
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build and package amc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs every commit and tag to find the previous release.
          fetch-depth: 0

      - name: Resolve version and mode
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          case "$EVENT" in
            push)
              dry=false
              if [ "$REF_NAME" != "v$pkg" ]; then
                echo "::error::tag $REF_NAME does not match package.json version $pkg (expected v$pkg)"
                exit 1
              fi
              ;;
            workflow_dispatch)
              dry=$INPUT_DRY_RUN
              want=${INPUT_VERSION#v}
              if [ -n "$want" ] && [ "$want" != "$pkg" ]; then
                echo "::error::version input $want does not match package.json version $pkg"
                exit 1
              fi
              if [ "$dry" != "true" ] && [ "$REF" != "refs/heads/main" ]; then
                echo "::error::a real release from workflow_dispatch must run on main (got $REF); releases are tagged from main"
                exit 1
              fi
              ;;
            *) dry=true ;;
          esac
          # Alpha: every 0.x release, and anything with a pre-release suffix, is a pre-release.
          case "$pkg" in 0.*|*-*) pre=true ;; *) pre=false ;; esac
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "### amc v$pkg" >> "$GITHUB_STEP_SUMMARY"
          echo "dry run: $dry, pre-release: $pre" >> "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build web UI
        working-directory: apps/web
        run: bun run build

      # One ubuntu runner cross-compiles all four targets with bun --target. Bun ad-hoc
      # signs the darwin outputs itself; without a signature Apple Silicon kills the binary.
      - name: Build amc for every target
        run: bun apps/cli/build.ts --all

      - name: Check the binaries
        run: |
          set -euo pipefail
          file dist/amc-*
          file dist/amc-darwin-arm64 | grep -q 'Mach-O 64-bit.*arm64'
          file dist/amc-darwin-x64 | grep -q 'Mach-O 64-bit.*x86_64'
          file dist/amc-linux-x64 | grep -q 'ELF 64-bit.*x86-64'
          file dist/amc-linux-arm64 | grep -q 'ELF 64-bit.*aarch64'
          got=$(./dist/amc-linux-x64 --version)
          [ "$got" = "${{ steps.version.outputs.version }}" ] || { echo "::error::amc --version printed $got"; exit 1; }

      - name: Package tarballs and SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for p in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            stage="dist/stage/$p"
            mkdir -p "$stage"
            cp "dist/amc-$p" "$stage/amc"
            chmod 755 "$stage/amc"
            cp README.md "$stage/"
            [ -f LICENSE ] && cp LICENSE "$stage/"
            tar -C "$stage" -czf "dist/release/amc-$VERSION-$p.tar.gz" .
          done
          (cd dist/release && sha256sum amc-*.tar.gz > SHA256SUMS)
          cat dist/release/SHA256SUMS

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # Range is <previous v* tag reachable from HEAD>..HEAD; the first release takes all history.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -vx "v$VERSION" | head -n1 || true)
          range=${prev:+$prev..HEAD}
          echo "notes range: ${range:-all history}"
          git cliff --config cliff.toml --tag "v$VERSION" --strip all $range > dist/release/notes.md
          cat dist/release/notes.md >> "$GITHUB_STEP_SUMMARY"
          test -s dist/release/notes.md

      - name: Changelog preview
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git cliff --config cliff.toml --tag "v$VERSION" -o dist/release/CHANGELOG.md
          # cliff.toml's header must match CHANGELOG.md's, or the post-release regeneration
          # would rewrite the file's intro. Compare everything above the first "## [" line.
          intro() { awk '/^## \[/{exit} {print}' "$1"; }
          if ! diff <(intro CHANGELOG.md) <(intro dist/release/CHANGELOG.md); then
            echo "::error::CHANGELOG.md intro differs from the header in cliff.toml; make them identical"
            exit 1
          fi

      - name: Render the Homebrew formula
        run: bun scripts/render-formula.ts --version "${{ steps.version.outputs.version }}" --sums dist/release/SHA256SUMS --out dist/release/amc.rb

      - uses: actions/upload-artifact@v7
        with:
          name: amc-${{ steps.version.outputs.version }}-darwin-arm64
          path: dist/release/amc-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: amc-${{ steps.version.outputs.version }}-darwin-x64
          path: dist/release/amc-${{ steps.version.outputs.version }}-darwin-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: amc-${{ steps.version.outputs.version }}-linux-x64
          path: dist/release/amc-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: amc-${{ steps.version.outputs.version }}-linux-arm64
          path: dist/release/amc-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-meta
          path: |
            dist/release/SHA256SUMS
            dist/release/notes.md
            dist/release/amc.rb
            dist/release/CHANGELOG.md
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: needs.build.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # --target only matters for a dispatch run on main: a pushed tag already exists.
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release/notes.md \
            "${flags[@]}" \
            release/amc-*.tar.gz release/SHA256SUMS

  # CHANGELOG.md on main is regenerated after the release exists, so the new tag is there to
  # section by and nobody edits it by hand. The tagged tree itself carries the previous
  # CHANGELOG; the release notes are the record for that version.
  changelog:
    name: CHANGELOG.md on main
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Regenerate and push
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git cliff --config cliff.toml -o CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): v$VERSION"
          git push origin HEAD:main

  tap:
    name: Homebrew tap
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for the tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so Formula/amc.rb was not pushed to dannyhawkins/homebrew-tap. The release itself is done; see docs/releasing.md to add the token, then push the formula from the release-meta artifact by hand."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: release-meta
          path: meta

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          repository: dannyhawkins/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push Formula/amc.rb
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp meta/amc.rb tap/Formula/amc.rb
          cd tap
          if git diff --quiet --exit-code -- Formula/amc.rb && git ls-files --error-unmatch Formula/amc.rb >/dev/null 2>&1; then
            echo "Formula/amc.rb already at v$VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/amc.rb
          git commit -m "amc $VERSION"
          git push
