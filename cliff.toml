# git-cliff config (https://git-cliff.org/docs/configuration). The release workflow uses it
# twice: release notes over <previous tag>..HEAD (all history for the first release) with the
# header stripped, and CHANGELOG.md over all history. History from before conventional
# commits lands under "Other" rather than vanishing.

[changelog]
# Must stay identical to the top of CHANGELOG.md, which is regenerated from this config.
header = """
# Changelog

All notable changes to this project are listed here. The project is alpha (0.x), so minor
versions may break things; pre-releases are tagged `vX.Y.Z-alpha.N` or similar.

This file is generated by [git-cliff](https://git-cliff.org) from
[Conventional Commits](https://www.conventionalcommits.org) at release time. Do not edit
released sections by hand; write a good commit message instead. See
[CONTRIBUTING.md](CONTRIBUTING.md#commit-messages).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }} \
({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
# The <!-- n --> prefixes fix the section order; the template strips them.
commit_parsers = [
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Docs" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(ci|build)", group = "<!-- 6 -->CI and build" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
